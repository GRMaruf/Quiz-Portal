<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title>{% block title %}Quiz Portal{% endblock %}</title>
  </head>
  <body style="min-height: 100vh; background: #f4f7fb;">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">Quiz Portal</a>
        <div class="d-flex gap-2">
          {% if user.is_authenticated %}
            {% if user.is_staff %}
              <a class="btn btn-outline-light btn-sm" href="{% url 'quiz_panel' %}">Quiz Panel</a>
            {% endif %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'participant_profile' %}">Profile</a>
            <a class="btn btn-light btn-sm" href="{% url 'logout' %}">Logout</a>
          {% else %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
            <a class="btn btn-light btn-sm" href="{% url 'register' %}">Register</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% if messages %}
        <div class="mb-3">
          {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} mb-2">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
