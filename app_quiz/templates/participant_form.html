{% extends 'base.html' %}

{% block title %}Participant Profile{% endblock %}

{% block content %}
  <div class="mx-auto card shadow-sm" style="max-width: 560px;">
    <div class="card-body">
      <h3 class="card-title mb-3">Participant Information</h3>

      <form method="post">
        {% csrf_token %}
        {% include 'forms/form-core.html' %}
        <button type="submit" class="btn btn-primary">Save Profile</button>
      </form>
    </div>
  </div>
{% endblock %}
